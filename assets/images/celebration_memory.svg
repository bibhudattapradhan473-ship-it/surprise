<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="100%">
  <defs>
    <!-- Rich Museum Wall Gradient -->
    <radialGradient id="gallerySpotlight" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#324357"/>
      <stop offset="50%" stop-color="#1A2430"/>
      <stop offset="100%" stop-color="#0E131A"/>
    </radialGradient>

    <!-- Ornate Gilded Picture Frame -->
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#E99A2D"/>
      <stop offset="50%" stop-color="#9E5D0E"/>
      <stop offset="75%" stop-color="#F2AE38"/>
      <stop offset="100%" stop-color="#6E3E03"/>
    </linearGradient>

    <!-- Warm Canvas Glow -->
    <linearGradient id="canvasSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152636"/>
      <stop offset="40%" stop-color="#2D5569"/>
      <stop offset="70%" stop-color="#E58E58"/>
      <stop offset="100%" stop-color="#FDE8B3"/>
    </linearGradient>

    <filter id="frameShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="brassSheen">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="1" specularExponent="20" result="spec">
        <fePointLight x="-100" y="-100" z="200"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Museum Wall Background with Soft Spotlight -->
  <rect width="700" height="850" fill="url(#gallerySpotlight)"/>

  <!-- Ornate Gilded Frame Outer Shadow -->
  <g filter="url(#frameShadow)">
    <!-- Outer Gold Frame Molding -->
    <rect x="75" y="60" width="550" height="640" rx="12" fill="url(#goldLeaf)" stroke="#4E2B02" stroke-width="4"/>
    
    <!-- Carved Inner Bevel -->
    <rect x="95" y="80" width="510" height="600" rx="6" fill="#4E2B02"/>
    <rect x="100" y="85" width="500" height="590" rx="4" fill="url(#goldLeaf)"/>
    
    <!-- Linen Mat / Passe-Partout -->
    <rect x="115" y="100" width="470" height="560" fill="#F4EFE6" stroke="#D5CBBB" stroke-width="2"/>
    <rect x="119" y="104" width="462" height="552" fill="none" stroke="#B8A793" stroke-width="1"/>

    <!-- Inner Artwork Canvas -->
    <rect x="140" y="125" width="420" height="470" fill="url(#canvasSky)"/>

    <!-- Stars & Sparkles in Artwork -->
    <g fill="#FFF" opacity="0.9">
      <circle cx="200" cy="170" r="2"/>
      <circle cx="280" cy="150" r="1.5"/>
      <circle cx="360" cy="180" r="2.5"/>
      <circle cx="450" cy="160" r="1.8"/>
      <circle cx="500" cy="200" r="2"/>
      <circle cx="230" cy="220" r="1.2"/>
    </g>

    <!-- Warm Golden Ambient Sun Glow -->
    <circle cx="350" cy="380" r="160" fill="#FFE099" opacity="0.4"/>
    <circle cx="350" cy="390" r="90" fill="#FFC966" opacity="0.6"/>

    <!-- Horizon Line & Sparkler Lights -->
    <path d="M 140 460 Q 280 430 420 450 Q 500 440 560 465 L 560 595 L 140 595 Z" fill="#1B141E"/>

    <!-- Joyful Best Friends Raising Glasses / Sparklers in Celebration -->
    <g fill="#0C060D">
      <!-- Friend 1 (Left) -->
      <circle cx="300" cy="360" r="26"/>
      <path d="M 275 385 C 280 375, 320 375, 325 385 L 330 490 L 270 490 Z"/>
      <!-- Arm holding up sparkler high -->
      <path d="M 280 400 L 240 330 L 250 325 L 290 395 Z"/>

      <!-- Friend 2 (Right) laughing, arm around friend -->
      <circle cx="390" cy="355" r="25"/>
      <path d="M 365 380 C 370 370, 410 370, 415 380 L 420 490 L 360 490 Z"/>
      <!-- Arm around friend 1 -->
      <path d="M 370 395 Q 335 400 310 405 L 315 418 Q 345 412 375 410 Z"/>
      <!-- Arm holding up sparkler high -->
      <path d="M 410 395 L 450 325 L 460 330 L 420 400 Z"/>
    </g>

    <!-- Sparkler 1 Fireworks Burst (Left) -->
    <g transform="translate(240, 325)">
      <circle cx="0" cy="0" r="6" fill="#FFF"/>
      <circle cx="0" cy="0" r="20" fill="#FFE599" opacity="0.6"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#FFD15C" stroke-width="2"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#FFD15C" stroke-width="2"/>
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#FFB020" stroke-width="1.8"/>
      <line x1="20" y1="-20" x2="-20" y2="20" stroke="#FFB020" stroke-width="1.8"/>
      <circle cx="15" cy="-22" r="2" fill="#FFF"/>
      <circle cx="-24" cy="16" r="2" fill="#FFF"/>
    </g>

    <!-- Sparkler 2 Fireworks Burst (Right) -->
    <g transform="translate(455, 320)">
      <circle cx="0" cy="0" r="6" fill="#FFF"/>
      <circle cx="0" cy="0" r="20" fill="#FFE599" opacity="0.6"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#FFD15C" stroke-width="2"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#FFD15C" stroke-width="2"/>
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#FFB020" stroke-width="1.8"/>
      <line x1="20" y1="-20" x2="-20" y2="20" stroke="#FFB020" stroke-width="1.8"/>
      <circle cx="-16" cy="-20" r="2" fill="#FFF"/>
      <circle cx="22" cy="18" r="2" fill="#FFF"/>
    </g>

    <!-- Artwork Caption Inside Passe-Partout -->
    <text x="350" y="625" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" font-weight="700" 
          text-anchor="middle" fill="#26312F">"A friendship woven in gold and laughter."</text>
    <text x="350" y="645" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" 
          letter-spacing="2" text-anchor="middle" fill="#79796F">PERMANENT MASTERPIECE COLLECTION</text>
  </g>

  <!-- Museum Brass Gallery Wall Plaque Below the Frame -->
  <g transform="translate(225, 740)" filter="url(#frameShadow)">
    <rect x="0" y="0" width="250" height="60" rx="4" fill="url(#goldLeaf)" stroke="#533107" stroke-width="2"/>
    <!-- Fastening bolts -->
    <circle cx="12" cy="12" r="3" fill="#422502"/>
    <circle cx="238" cy="12" r="3" fill="#422502"/>
    <circle cx="12" cy="48" r="3" fill="#422502"/>
    <circle cx="238" cy="48" r="3" fill="#422502"/>
    <!-- Plaque Text -->
    <text x="125" y="26" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="800" 
          letter-spacing="3" text-anchor="middle" fill="#1C1004">EXHIBIT NO. 07</text>
    <text x="125" y="46" font-family="'Playfair Display', serif" font-size="15" font-weight="700" 
          font-style="italic" text-anchor="middle" fill="#2C1A06">"The Unbreakable Bond"</text>
  </g>
</svg>
