<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Organic Wax Gradient -->
    <radialGradient id="waxGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#E25555"/>
      <stop offset="35%" stop-color="#B82222"/>
      <stop offset="70%" stop-color="#801010"/>
      <stop offset="100%" stop-color="#4E0505"/>
    </radialGradient>

    <!-- Gold Foil Crest Gradient -->
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="40%" stop-color="#E99A2D"/>
      <stop offset="75%" stop-color="#9C5E0D"/>
      <stop offset="100%" stop-color="#FFD470"/>
    </linearGradient>

    <filter id="waxShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#2B0505" flood-opacity="0.6"/>
    </filter>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="1" specularExponent="15" result="spec">
        <fePointLight x="-200" y="-200" z="300"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="comp"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="comp"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wax Seal Melting Droplets and Irregular Organic Edge -->
  <g filter="url(#waxShadow)">
    <path d="M 100 12 
             C 125 10, 148 18, 168 36 
             C 188 54, 194 76, 192 100 
             C 195 125, 185 152, 165 170 
             C 145 188, 118 194, 95 192 
             C 70 195, 42 186, 26 166 
             C 10 146, 6 120, 8 96 
             C 7 70, 18 42, 38 26 
             C 58 10, 78 14, 100 12 Z" 
          fill="url(#waxGrad)"/>
    
    <!-- Outer Rim Ridge -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="#660A0A" stroke-width="4" opacity="0.6"/>
    <circle cx="98" cy="98" r="68" fill="none" stroke="#FF7B7B" stroke-width="2" opacity="0.4"/>
    
    <!-- Inner Recessed Impression Bed -->
    <circle cx="100" cy="100" r="62" fill="#750E0E"/>
    
    <!-- Beaded Ring Accent -->
    <circle cx="100" cy="100" r="54" fill="none" stroke="url(#crestGold)" stroke-width="2" stroke-dasharray="2, 6" stroke-linecap="round"/>

    <!-- Emblem: Intertwined Infinity & Friendship Hearts -->
    <g filter="url(#emboss)" transform="translate(100, 98) scale(0.85)">
      <!-- Central Heart Motif -->
      <path d="M 0 18 
               C -2 -5, -28 -12, -28 -32 
               C -28 -48, -12 -58, 0 -44 
               C 12 -58, 28 -48, 28 -32 
               C 28 -12, 2 -5, 0 18 Z" 
            fill="url(#crestGold)" stroke="#532B03" stroke-width="1.5"/>

      <!-- Interlocking Infinity Loop Behind -->
      <path d="M -32 -20 
               C -48 -20, -56 -35, -42 -44 
               C -28 -52, -18 -30, 0 -30 
               C 18 -30, 28 -52, 42 -44 
               C 56 -35, 48 -20, 32 -20" 
            fill="none" stroke="url(#crestGold)" stroke-width="3" stroke-linecap="round"/>

      <!-- Small Star / Sparkle in Center -->
      <circle cx="0" cy="-30" r="3.5" fill="#FFFBE6"/>
    </g>

    <!-- Top Left Gloss Highlight for Authentic Wax Sheen -->
    <path d="M 50 35 C 75 22, 120 22, 145 35 C 130 30, 70 30, 50 35 Z" fill="#FFA5A5" opacity="0.4"/>
  </g>
</svg>
