<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Lighting and Shading Gradients -->
    <radialGradient id="portalGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#E99A2D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10151D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="archWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A281E"/>
      <stop offset="50%" stop-color="#241710"/>
      <stop offset="100%" stop-color="#150D08"/>
    </linearGradient>

    <linearGradient id="doorLeafLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D291E"/>
      <stop offset="25%" stop-color="#4F3628"/>
      <stop offset="85%" stop-color="#2D1C13"/>
      <stop offset="100%" stop-color="#1B1009"/>
    </linearGradient>

    <linearGradient id="doorLeafRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B1009"/>
      <stop offset="15%" stop-color="#2D1C13"/>
      <stop offset="75%" stop-color="#4F3628"/>
      <stop offset="100%" stop-color="#3D291E"/>
    </linearGradient>

    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE599"/>
      <stop offset="35%" stop-color="#E99A2D"/>
      <stop offset="70%" stop-color="#9C5E0D"/>
      <stop offset="100%" stop-color="#FFD470"/>
    </linearGradient>

    <linearGradient id="transomGaze" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#121D28"/>
      <stop offset="50%" stop-color="#176F65" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFE3A0" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="doorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Light from behind -->
  <circle cx="300" cy="350" r="280" fill="url(#portalGlow)"/>

  <!-- Outer Architectural Portal / Arch Surround -->
  <path d="M 120 780 L 120 320 Q 120 120 300 120 Q 480 120 480 320 L 480 780 Z" 
        fill="url(#archWood)" filter="url(#doorShadow)"/>

  <!-- Stone Moldings & Cornice Lines -->
  <path d="M 100 780 L 100 320 Q 100 90 300 90 Q 500 90 500 320 L 500 780 L 480 780 L 480 320 Q 480 120 300 120 Q 120 120 120 320 L 120 780 Z" 
        fill="#261A13"/>

  <!-- Transom Window (Arch Fanlight) -->
  <path d="M 140 320 Q 140 145 300 145 Q 460 145 460 320 Z" fill="url(#transomGaze)"/>
  
  <!-- Transom Radial Spokes -->
  <g stroke="#2D1D13" stroke-width="4" stroke-linecap="round">
    <line x1="300" y1="320" x2="300" y2="145"/>
    <line x1="300" y1="320" x2="200" y2="175"/>
    <line x1="300" y1="320" x2="400" y2="175"/>
    <line x1="300" y1="320" x2="155" y2="245"/>
    <line x1="300" y1="320" x2="445" y2="245"/>
    <!-- Outer transom ring -->
    <path d="M 190 320 Q 190 205 300 205 Q 410 205 410 320" fill="none" stroke-width="3"/>
  </g>

  <!-- Door Frame Moulding -->
  <rect x="136" y="320" width="328" height="460" fill="none" stroke="#251710" stroke-width="8"/>
  <rect x="142" y="324" width="316" height="456" fill="#120B07"/>

  <!-- Left Door Leaf -->
  <g class="door-leaf-left">
    <rect x="145" y="326" width="152" height="450" fill="url(#doorLeafLeft)"/>
    <!-- Top Raised Panel -->
    <rect x="160" y="350" width="122" height="180" rx="4" fill="#362217" stroke="#1A1009" stroke-width="3"/>
    <rect x="168" y="358" width="106" height="164" rx="2" fill="#452C1E" stroke="#5E3F2D" stroke-width="2"/>
    <!-- Inner Panel Diamond Carving -->
    <polygon points="221,385 255,440 221,495 187,440" fill="none" stroke="url(#brassGold)" stroke-width="2" opacity="0.6"/>
    <!-- Bottom Raised Panel -->
    <rect x="160" y="556" width="122" height="190" rx="4" fill="#362217" stroke="#1A1009" stroke-width="3"/>
    <rect x="168" y="564" width="106" height="174" rx="2" fill="#452C1E" stroke="#5E3F2D" stroke-width="2"/>

    <!-- Left Brass Handle & Keyhole -->
    <circle cx="282" cy="535" r="9" fill="url(#brassGold)" filter="url(#softGlow)"/>
    <path d="M 280 535 L 265 535 L 265 545 L 280 545 Z" fill="url(#brassGold)"/>
    <rect x="274" y="520" width="16" height="42" rx="3" fill="none" stroke="url(#brassGold)" stroke-width="2"/>
  </g>

  <!-- Right Door Leaf -->
  <g class="door-leaf-right">
    <rect x="303" y="326" width="152" height="450" fill="url(#doorLeafRight)"/>
    <!-- Top Raised Panel -->
    <rect x="318" y="350" width="122" height="180" rx="4" fill="#362217" stroke="#1A1009" stroke-width="3"/>
    <rect x="326" y="358" width="106" height="164" rx="2" fill="#452C1E" stroke="#5E3F2D" stroke-width="2"/>
    <!-- Inner Panel Diamond Carving -->
    <polygon points="379,385 413,440 379,495 345,440" fill="none" stroke="url(#brassGold)" stroke-width="2" opacity="0.6"/>
    <!-- Bottom Raised Panel -->
    <rect x="318" y="556" width="122" height="190" rx="4" fill="#362217" stroke="#1A1009" stroke-width="3"/>
    <rect x="326" y="564" width="106" height="174" rx="2" fill="#452C1E" stroke="#5E3F2D" stroke-width="2"/>

    <!-- Right Brass Handle -->
    <circle cx="318" cy="535" r="9" fill="url(#brassGold)" filter="url(#softGlow)"/>
    <path d="M 320 535 L 335 535 L 335 545 L 320 545 Z" fill="url(#brassGold)"/>
    <rect x="310" y="520" width="16" height="42" rx="3" fill="none" stroke="url(#brassGold)" stroke-width="2"/>
  </g>

  <!-- Center Seam Shadow -->
  <rect x="297" y="324" width="6" height="454" fill="#0D0704"/>

  <!-- Brass Exhibition Door Plaque -->
  <g filter="url(#doorShadow)">
    <rect x="220" y="270" width="160" height="34" rx="4" fill="url(#brassGold)" stroke="#6C410A" stroke-width="2"/>
    <text x="300" y="292" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="12" font-weight="700" 
          letter-spacing="3" text-anchor="middle" fill="#241407">EXHIBIT NO. 1</text>
    <!-- Screws on plaque -->
    <circle cx="228" cy="287" r="2" fill="#583508"/>
    <circle cx="372" cy="287" r="2" fill="#583508"/>
  </g>

  <!-- Warm Threshold Light Spill -->
  <ellipse cx="300" cy="780" rx="190" ry="18" fill="url(#portalGlow)"/>
</svg>
