<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <filter id="inkRoughness">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g transform="rotate(-6 160 90)" filter="url(#inkRoughness)">
    <!-- Outer Double Stamped Rectangles -->
    <rect x="15" y="15" width="290" height="150" rx="10" fill="none" stroke="#B82222" stroke-width="4.5" stroke-dasharray="160 3 90 2"/>
    <rect x="23" y="23" width="274" height="134" rx="6" fill="none" stroke="#B82222" stroke-width="2" opacity="0.85"/>

    <!-- Archival Header -->
    <text x="160" y="52" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="900" 
          letter-spacing="6" text-anchor="middle" fill="#B82222">ARCHIVES OF FRIENDSHIP</text>

    <!-- Star Divider -->
    <line x1="45" y1="62" x2="135" y2="62" stroke="#B82222" stroke-width="2"/>
    <text x="160" y="66" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#B82222">★ ★ ★</text>
    <line x1="185" y1="62" x2="275" y2="62" stroke="#B82222" stroke-width="2"/>

    <!-- Prominent Status -->
    <text x="160" y="106" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" 
          letter-spacing="4" text-anchor="middle" fill="#B82222">RATIFIED &amp; SEALED</text>

    <!-- Serial and Validity -->
    <text x="160" y="134" font-family="'Courier New', monospace" font-size="11" font-weight="700" 
          letter-spacing="3" text-anchor="middle" fill="#B82222">PERPETUAL COVENANT · BINDING FOREVER</text>
  </g>
</svg>
